services:
  - type: web
    runtime: node
    name: regloo
    # A persistent disk requires a paid instance type. On the free plan, remove
    # the `disk:` block below — but note the JSON store is then ephemeral.
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      # Set in the Render dashboard after creating the Stripe webhook endpoint.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Comma-separated e-mails allowed on /admin.
      - key: ADMIN_EMAILS
        sync: false
      # Umami analytics (optional — see umami/README.md). Both required to enable.
      - key: UMAMI_WEBSITE_ID
        sync: false
      - key: UMAMI_SRC
        sync: false
    disk:
      name: regloo-data
      mountPath: /var/data
      sizeGB: 1
